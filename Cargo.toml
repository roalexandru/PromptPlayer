[workspace]
resolver = "2"
members = ["src-tauri", "guest-helper", "typing-engine-cli"]

[workspace.package]
version = "0.1.7"
authors = ["Alex <roalexandru@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/roalexandru/PromptPlayer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
# `lto = "thin"` parallelizes link-time optimization across crates; `lto = true`
# (= "fat") forces a single-threaded LTO pass, which roughly doubles Windows
# link wall-clock for ~5% runtime gain. Thin LTO + 16 codegen-units gives us
# nearly the same runtime perf at meaningfully faster builds — important
# because the typing pipeline is gated on perf-sensitive crates (typer/
# distributions, schedule), not on whole-program inlining of the IPC layer.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
