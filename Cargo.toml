[workspace]
resolver = "2"
members = ["src-tauri", "guest-helper", "typing-engine-cli"]

[workspace.package]
version = "0.1.0"
authors = ["Alex <roalexandru@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/roalexandru/PromptPlayer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
