[package]
name = "prompt-player"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stealth keyboard utility for live demos"
default-run = "prompt-player"

[lib]
name = "prompt_player"
path = "src/lib.rs"

[[bin]]
name = "prompt-player"
path = "src/main.rs"

# `typing-engine-cli` lives in its own workspace crate (../typing-engine-cli)
# so tauri-bundler doesn't try to copy it into the .app/.msi during release
# builds. The universal-apple-darwin lipo step only fuses the main binary.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"
rand = { workspace = true }
rand_distr = { workspace = true }
rand_chacha = { workspace = true }

# keystroke synthesis
enigo = "0.2"
# keyboard listening — Windows uses rdev (SetWindowsHookEx wrapper);
# macOS uses a native CGEventTap impl in `hook/macos.rs`.
# rdev's macOS path SIGTRAPs on newer macOS (TSM thread assertion), and the
# `unstable_grab` feature pulls in TSM-touching code paths, so we never want
# rdev compiled on Mac builds.

# expressions sandbox
rquickjs = "0.11"

# fuzzy search
nucleo-matcher = "0.3"

# telemetry
tauri-plugin-aptabase = "1"
sysinfo = "0.31"

# Rust↔TS type contract (generates `src/lib/ipc.gen.ts` from `#[specta::Type]`).
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
specta-typescript = "=0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }

# markdown
pulldown-cmark = "0.12"

# encrypted local state — not yet wired up; previously declared as
# rusqlite + bundled-sqlcipher-vendored-openssl, but no source code uses
# it. Kept the comment as a placeholder for the planned usage-history
# store. Re-add when actually needed; meanwhile, dropping it removes a
# 3-5 min OpenSSL-from-source build on cold caches.

# file watching
notify = "6"

# async runtime
tokio = { version = "1", features = ["full"] }

# Rolling log-file appender — cross-platform sink for `tracing` so Windows
# (no os_log equivalent) and Mac (Console.app users who want a tail) can both
# diagnose runtime issues without a Terminal-launched debug build. Writes
# under `dirs::data_local_dir()/PromptPlayer/logs/` (mac:
# `~/Library/Application Support/PromptPlayer/logs/`; win:
# `%LOCALAPPDATA%\PromptPlayer\logs\`).
tracing-appender = "0.2"

# misc
once_cell = "1"
parking_lot = "0.12"
regex = "1"
phf = { version = "0.11", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
crossbeam-channel = "0.5"
sys-locale = "0.3"
# Window vibrancy: macOS NSVisualEffectView, Windows Mica/Acrylic. The crate
# is cross-platform; OS-specific calls (`apply_vibrancy`, `apply_mica`,
# `apply_acrylic`) live behind cfg gates at each call site.
window-vibrancy = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# Legacy objc/cocoa stack — used by some existing call sites; new code in
# `platform/macos/` uses objc2 instead. Both can coexist and we migrate
# module-by-module.
cocoa = "0.26"
objc = "0.2"
block = "0.1"
# Modern objc2 ecosystem (type-safe Obj-C bindings, no msg_send! macro).
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSData",
    "NSGeometry",
    "NSArray",
    "NSEnumerator",
    "NSValue",
    "NSURL",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSWindow",
    "NSPanel",
    "NSEvent",
    "NSScreen",
    "NSApplication",
    "NSWorkspace",
    "NSRunningApplication",
    "NSResponder",
    "NSView",
    "NSGraphics",
    "NSPasteboard",
    "libc",
] }
block2 = "0.5"
# Pipe `tracing` events into Apple Unified Logging so Console.app and
# `log stream --predicate 'subsystem == "com.roalexandru.promptplayer"'`
# show what the app is doing at runtime. Release-mode .app bundles route
# stdout/stderr to /dev/null, so without this the only way to debug a shipped
# build is to launch from Terminal — which is fine for devs, useless for users
# on a managed Mac who hit a "trigger doesn't fire" silent failure.
tracing-oslog = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_Media",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = [
    "macos-private-api",
    "tray-icon",
    "image-png",
    "test",
] }
http = "1"
