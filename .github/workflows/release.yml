name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Manual `workflow_dispatch`
# is also accepted for testing without creating a tag.
#
# Topology:
#
#                       ubuntu
#                   ┌─── smoke ───┐                          (60s; gates everything)
#                   ↓             ↓                          ↓
#         create-release      rust-tests                release-platform [matrix]
#         (ubuntu, 5s)        (macos, ~4min:                ↳ mac (~6min)
#                              fmt+clippy+                  ↳ win (~11min)
#                              cargo test)                    each leg:
#                                                              - tauri-apps/tauri-action
#                                                                (build + sign + upload
#                                                                 .dmg/.msi/.app.tar.gz
#                                                                 + .sig + latest.json
#                                                                 to draft Release)
#                                                              - e2e (validates the
#                                                                bundle Tauri just built)
#                              ↓                                   ↓
#                       publish-finalize  (ubuntu, ~5s)
#                       needs: [rust-tests, release-platform]
#                       if: success() — flips draft → published
#                              ↓
#                       populate-changelog  (ubuntu, ~30s)
#                       if: always() — appends auto-changelog
#
# Why tauri-action: it knows the per-Tauri-version artifact layout (asset
# names, signature formats) AND auto-generates latest.json when signing
# keys are set. Custom build+upload tripped over .msi.zip vs .msi.sig
# naming, space-in-path globs, bash 3.2 mapfile compat, asset-name
# mismatches in the compose step — all of which tauri-action handles.
#
# Why this shape:
# - Rust tests are ONE job on macOS (most platform-agnostic) running in
#   parallel to the slow Mac/Win builds — not duplicated inside each leg.
# - Each build leg uploads its bundle independently as soon as its own
#   e2e passes. Mac DMG ships at ~6min even while Win is still building.
# - publish-finalize is the gate: if rust-tests fails OR a build fails,
#   the artifacts that DID succeed stay in the draft Release — they
#   just don't get flipped to published. Manual review possible.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ~60s ubuntu fast-feedback gate. If anything here fails, no slow Mac/Win
  # runner gets spun up. Covers: version drift across the three manifests,
  # the IPC contract lint, frontend typecheck + vitest, and the IPC-registry
  # cross-check unit tests (which catch generate_handler! / collect_commands!
  # / .manage() drift before any platform-specific work runs).
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package.json / tauri.conf.json / Cargo.toml versions match
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' Cargo.toml | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "package.json:     $pkg"
          echo "tauri.conf.json:  $tauri"
          echo "Cargo.toml:       $cargo"
          if [ "$pkg" != "$tauri" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::version mismatch — bump all three to the same value"
            exit 1
          fi

      - name: Verify tag matches package.json (release builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          # Strip pre-release suffix (e.g. "0.1.0-rc.1" → "0.1.0") for the match.
          tag_base="${tag%%-*}"
          if [ "$pkg" != "$tag_base" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json $pkg"
            exit 1
          fi

      - name: Bundle ID smoke (locked at com.roalexandru.promptplayer)
        shell: bash
        run: |
          grep -q '"identifier": "com.roalexandru.promptplayer"' src-tauri/tauri.conf.json
          echo "bundle ID OK"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: IPC lint (no raw invoke() outside `$lib/ipc`)
        run: bash scripts/lint-ipc.sh
      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Frontend unit tests (Vitest)
        run: pnpm test

      # The IPC-registry cross-checks (commands::registry_tests) catch drift
      # between COMMAND_NAMES, generate_handler!, and collect_commands!.
      # They CAN'T run on Linux: the lib transitively pulls in `crate::inject`
      # and `crate::hook`, both of which are cfg-gated to macos/windows.
      # The Mac/Win matrix below runs them via `cargo test --workspace`, so
      # drift is still caught — just 5min later instead of 90s.

  # Create the empty Release shell up-front so the per-platform legs can each
  # `gh release upload` independently without racing on creation. Release is
  # left as a draft; populate-changelog (or you, manually) flips it.
  create-release:
    name: create release shell
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Notes come from `docs/release-notes/<tag>.md` when it exists, so the
      # highlights are written and reviewed with the version bump instead of
      # being whatever the commit subjects happened to say. Without that file
      # the release ships install steps plus the generated changelog.
      - name: Create draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — skipping create"
            exit 0
          fi

          body_file=$(mktemp)
          highlights="docs/release-notes/${tag}.md"
          if [ -f "$highlights" ]; then
            echo "using hand-written notes from $highlights"
            cat "$highlights" >> "$body_file"
            printf '\n' >> "$body_file"
          else
            echo "::warning::no $highlights — shipping install steps and the generated changelog only"
          fi

          cat >> "$body_file" <<'EOF'

          ### macOS install

          The DMG is built for Apple Silicon (arm64). First launch: right-click → **Open**
          (the build is unsigned).

          ### Windows install

          Run the MSI. SmartScreen may warn for unsigned builds — click
          **More info → Run anyway**.
          EOF

          gh release create "$tag" \
            --draft \
            --title "Prompt Player $tag" \
            --notes-file "$body_file"

  # ONE rust-tests job on macOS, parallel to the slow Mac/Win builds. Covers
  # all platform-agnostic tests (typer, prompts, store, matcher, undo, scopes,
  # commands::registry_tests). The handful of macos-only tests run too. We
  # don't run a Windows variant — `tests/ipc_registry.rs` is cfg-skipped on
  # Win anyway, and the rest of the suite is platform-independent.
  rust-tests:
    name: rust-tests (macos)
    needs: smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo (rust-tests)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            guest-helper
          shared-key: rust-tests
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Frontend build (needed for tauri::generate_context!)
        run: pnpm build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy (correctness only)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets

  # Per-OS independent build leg. Mac and Windows run in parallel and DO NOT
  # block each other: Mac (~6m) uploads its DMG as soon as its e2e is green;
  # Windows (~11m) uploads its MSI when ready. NO rust workspace tests in
  # here — those are in `rust-tests` above so they don't double-run AND so a
  # test failure doesn't sink the bundle production.
  release-platform:
    name: release (${{ matrix.platform.name }})
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Both legs pass --target so the build output sits in a uniform
          # target/<triple>/release/bundle/... path — same shape for the
          # e2e scripts on either OS.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            # Matrix-selected e2e command, invoked from a single non-conditional
            # step below.
            e2e_cmd: "bash scripts/e2e-mac.sh"
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            # Git Bash on the Windows runner has pwsh on PATH, so calling
            # pwsh from a bash shell works.
            e2e_cmd: "pwsh scripts/e2e-win.ps1 -Target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      # Defender exclusion saves ~25% on Windows wall-clock.
      - name: Disable Defender scan on build dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\node_modules"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            guest-helper
          shared-key: ${{ matrix.platform.name }}

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      # Frontend dist must exist before cargo touches anything that pulls
      # tauri::generate_context!() at compile time.
      - name: Frontend build
        run: pnpm build

      # NB: NO clippy / cargo test here. Those run in the parallel
      # `rust-tests` job. This leg only PRODUCES the bundle.
      #
      # tauri-action does build + sign + upload to the draft Release in one
      # step. It knows the per-Tauri-version artifact layout (which has
      # changed between v1 and v2 — .msi.zip vs .msi.sig, etc.), so we
      # don't have to track every format change ourselves like we did when
      # rolling our own find/upload loop. Signing env vars trigger emission
      # of .app.tar.gz (Mac) / .msi.sig (Win) updater sidecars.
      #
      # Releases are uploaded as draft. publish-finalize flips them to
      # published only when rust-tests + e2e (this leg) all pass.
      - name: Build + upload via tauri-action
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prompt Player ${{ github.ref_name }}"
          releaseDraft: true
          # `prerelease` here only sets the flag at create-time. We let
          # publish-finalize own the final draft/prerelease/latest decision
          # since that depends on the tag suffix (-rc.X vs stable).
          prerelease: false
          args: ${{ matrix.platform.args }}

      # E2E runs AFTER tauri-action. The bundle is already on disk in
      # target/<triple>/release/bundle/ (tauri-action just ran the build),
      # AND already in the draft Release. If e2e fails, the matrix job
      # fails → publish-finalize won't run → the artifacts that did upload
      # stay in the draft for human inspection. Matches the "leave the
      # artefacts on test failure" rule.
      - name: E2E (${{ matrix.platform.name }})
        env:
          TARGET_TRIPLE: ${{ matrix.platform.target }}
          PROMPT_PLAYER_E2E: "1"
        shell: bash
        run: ${{ matrix.platform.e2e_cmd }}

  # Compose `latest.json` (the manifest tauri-plugin-updater fetches) once
  # all platform legs have uploaded their signed bundles. Format per
  # https://v2.tauri.app/plugin/updater/#static-json-file:
  #   { version, notes, pub_date, platforms: { <triple>: { signature, url } } }
  # The signature is the raw content of the `.sig` file Tauri emitted next
  # to the updater archive; the URL is the GitHub release-asset download URL.
  # Skipped on platform-leg failure — partial manifests would brick clients.
  # NOTE: The `compose-updater-manifest` job that used to live here was
  # deleted — tauri-action 0.6+ already generates and uploads latest.json
  # automatically when TAURI_SIGNING_PRIVATE_KEY is set. Verified on
  # rc.7: the auto-generated manifest contains both darwin-aarch64 and
  # windows-x86_64 entries with valid signatures, exactly the shape
  # tauri-plugin-updater expects.

  # The publish gate. Flips the draft Release to published ONLY if rust-tests
  # AND every build-platform leg succeeded. If either fails, the release
  # stays as a draft with whatever artifacts did land — you can manually
  # inspect, decide whether to publish, or kick a new tag.
  publish-finalize:
    name: publish finalize (draft → published)
    # tauri-action uploads latest.json as part of the release-platform
    # leg itself, so by the time release-platform finishes the manifest
    # is already attached. No separate compose step to wait on.
    needs: [rust-tests, release-platform]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark release as published (if currently draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `-R` so gh doesn't try to run `git remote get-url` — this job
          # has no actions/checkout (doesn't need the source), so there's
          # no git context available.
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          # Pre-releases (rc/alpha/beta) get the prerelease flag set true so
          # the `latest` redirect skips them. Stable releases publish as
          # latest.
          if [[ "$tag" == *-* ]]; then
            echo "tag $tag is a pre-release"
            gh release edit "$tag" --draft=false --prerelease
          else
            echo "tag $tag is a stable release — publishing as latest"
            gh release edit "$tag" --draft=false --latest
          fi

  # Runs once after publish-finalize, regardless of pass/fail. If publish
  # was skipped (rust-tests or a build failed) the release is still draft
  # but we still append auto-changelog so reviewers see what's in it.
  populate-changelog:
    name: populate auto-changelog
    needs: [release-platform, publish-finalize]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate and apply auto-changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "no release at $tag — nothing to populate"
            exit 0
          fi
          notes=$(gh api \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$tag" \
            -q .body)
          existing=$(gh release view "$tag" --json body -q .body)
          combined="${existing}

          ---

          ${notes}"
          gh release edit "$tag" --notes "$combined"
