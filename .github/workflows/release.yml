name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Manual `workflow_dispatch`
# is also accepted for testing without creating a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the build on a fast green check — typecheck, frontend tests, and
  # backend tests. If any fail, no DMG/MSI gets uploaded.
  test:
    name: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            guest-helper

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend unit tests
        run: pnpm test

      # tauri::generate_context!() reads frontendDist (../dist) at compile
      # time and panics if the directory is missing. Build the frontend
      # before cargo so the lib compiles for `cargo test`.
      - name: Frontend production build
        run: pnpm build

      - name: Rust workspace tests
        run: cargo test --workspace

  build:
    name: build (${{ matrix.platform.name }})
    needs: test
    # tauri-action creates / updates a GitHub Release and uploads the
    # DMG/MSI assets. That requires write access to repository contents
    # — without this the API call fails with
    # "Resource not accessible by integration".
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      # Tell Microsoft Defender to skip Cargo's churn directories on Windows.
      # Defender real-time scan adds ~25% overhead to every file write/open;
      # Cargo writes ~100k small files per build. Runner is ephemeral, so the
      # exclusion is gone when the job ends.
      - name: Disable Defender scan on build dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\node_modules"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            guest-helper

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Bundle ID smoke test (locked at com.roalexandru.promptplayer)
        shell: bash
        run: |
          grep -q '"identifier": "com.roalexandru.promptplayer"' src-tauri/tauri.conf.json
          echo "bundle ID OK"

      # tauri-action handles: building the frontend, running cargo bundle,
      # creating the GitHub Release (or appending to one if it already
      # exists for the same tag), and uploading the DMG/MSI artifacts.
      # Signing/notarization is intentionally absent — produces unsigned
      # .dmg / .msi until you provision Apple Developer ID and Windows EV
      # certificate. README documents the one-time bypass.
      #
      # Updater signing keys (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]) are
      # commented out — wire only when shipping the updater plugin.
      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prompt Player ${{ github.ref_name }}"
          releaseBody: |
            ## What's new

            See the auto-generated changelog below.

            ### macOS install
            Universal DMG runs on Apple Silicon and Intel Macs.
            First launch: right-click → **Open** (unsigned build).

            ### Windows install
            Run the MSI. SmartScreen may warn for unsigned builds — click **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}

  # Once both build matrix jobs have published their artifacts, populate the
  # Release body with GitHub's native auto-generated changelog ("what
  # changed since the previous tag"). Done as a separate job so it runs
  # exactly once even though the matrix produces two builds.
  populate-changelog:
    name: populate auto-changelog
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate and apply auto-changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          notes=$(gh api \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$tag" \
            -q .body)
          # Append below the canned install instructions tauri-action wrote.
          existing=$(gh release view "$tag" --json body -q .body)
          combined="${existing}

          ---

          ${notes}"
          gh release edit "$tag" --notes "$combined"
