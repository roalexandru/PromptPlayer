name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Manual `workflow_dispatch`
# is also accepted for testing without creating a tag.
#
# Topology:
#
#                       ubuntu
#                   ┌─── smoke ───┐                          (60s; gates everything)
#                   ↓             ↓                          ↓
#         create-release      rust-tests                build-platform [matrix]
#         (ubuntu, 5s)        (macos, ~4min:                ↳ mac (~6min)
#                              fmt+clippy+                  ↳ win (~11min)
#                              cargo test --workspace)        each: pnpm + tauri build
#                                                              + e2e + gh upload
#                                                              (per-leg, parallel;
#                                                               .dmg/.msi + signed
#                                                               .app.tar.gz/.msi.zip
#                                                               + .sig sidecars)
#                                                                  ↓
#                                                          compose-updater-manifest
#                                                          (ubuntu, ~10s — downloads
#                                                           .sig files, writes +
#                                                           uploads latest.json)
#                              ↓                                   ↓
#                       publish-finalize  (ubuntu, ~5s)
#                       needs: [rust-tests, release-platform, compose-updater-manifest]
#                       if: success() — flips draft → published
#                              ↓
#                       populate-changelog  (ubuntu, ~30s)
#                       if: always() — appends auto-changelog
#
# Why this shape:
# - Rust tests are ONE job on macOS (most platform-agnostic) running in
#   parallel to the slow Mac/Win builds — not duplicated inside each leg.
# - Each build leg uploads its bundle independently as soon as its own
#   e2e passes. Mac DMG ships at ~6min even while Win is still building.
# - publish-finalize is the gate: if rust-tests fails OR a build fails,
#   the artifacts that DID succeed stay in the draft Release — they
#   just don't get flipped to published. Manual review possible.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ~60s ubuntu fast-feedback gate. If anything here fails, no slow Mac/Win
  # runner gets spun up. Covers: version drift across the three manifests,
  # the IPC contract lint, frontend typecheck + vitest, and the IPC-registry
  # cross-check unit tests (which catch generate_handler! / collect_commands!
  # / .manage() drift before any platform-specific work runs).
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package.json / tauri.conf.json / Cargo.toml versions match
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' Cargo.toml | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "package.json:     $pkg"
          echo "tauri.conf.json:  $tauri"
          echo "Cargo.toml:       $cargo"
          if [ "$pkg" != "$tauri" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::version mismatch — bump all three to the same value"
            exit 1
          fi

      - name: Verify tag matches package.json (release builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          # Strip pre-release suffix (e.g. "0.1.0-rc.1" → "0.1.0") for the match.
          tag_base="${tag%%-*}"
          if [ "$pkg" != "$tag_base" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json $pkg"
            exit 1
          fi

      - name: Bundle ID smoke (locked at com.roalexandru.promptplayer)
        shell: bash
        run: |
          grep -q '"identifier": "com.roalexandru.promptplayer"' src-tauri/tauri.conf.json
          echo "bundle ID OK"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: IPC lint (no raw invoke() outside `$lib/ipc`)
        run: bash scripts/lint-ipc.sh
      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Frontend unit tests (Vitest)
        run: pnpm test

      # The IPC-registry cross-checks (commands::registry_tests) catch drift
      # between COMMAND_NAMES, generate_handler!, and collect_commands!.
      # They CAN'T run on Linux: the lib transitively pulls in `crate::inject`
      # and `crate::hook`, both of which are cfg-gated to macos/windows.
      # The Mac/Win matrix below runs them via `cargo test --workspace`, so
      # drift is still caught — just 5min later instead of 90s.

  # Create the empty Release shell up-front so the per-platform legs can each
  # `gh release upload` independently without racing on creation. Release is
  # left as a draft; populate-changelog (or you, manually) flips it.
  create-release:
    name: create release shell
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — skipping create"
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "Prompt Player $tag" \
            --notes "$(cat <<'EOF'
          ## What's new

          Auto-generated changelog will be appended once both platform builds finish.

          ### macOS install
          DMG is built for Apple Silicon (arm64). First launch: right-click → **Open** (unsigned build).

          ### Windows install
          Run the MSI. SmartScreen may warn for unsigned builds — click **More info → Run anyway**.
          EOF
          )"

  # ONE rust-tests job on macOS, parallel to the slow Mac/Win builds. Covers
  # all platform-agnostic tests (typer, prompts, store, matcher, undo, scopes,
  # commands::registry_tests). The handful of macos-only tests run too. We
  # don't run a Windows variant — `tests/ipc_registry.rs` is cfg-skipped on
  # Win anyway, and the rest of the suite is platform-independent.
  rust-tests:
    name: rust-tests (macos)
    needs: smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo (rust-tests)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            guest-helper
          shared-key: rust-tests
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Frontend build (needed for tauri::generate_context!)
        run: pnpm build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy (correctness only)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets

  # Per-OS independent build leg. Mac and Windows run in parallel and DO NOT
  # block each other: Mac (~6m) uploads its DMG as soon as its e2e is green;
  # Windows (~11m) uploads its MSI when ready. NO rust workspace tests in
  # here — those are in `rust-tests` above so they don't double-run AND so a
  # test failure doesn't sink the bundle production.
  release-platform:
    name: release (${{ matrix.platform.name }})
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          # IMPORTANT: BOTH platforms pass --target so the output path is
          # uniformly target/<triple>/release/bundle/... — same shape for
          # the e2e scripts and gh release upload globs. Workspace root is
          # the repo root (Cargo.toml at ./), so target/ is at the repo
          # root, NOT under src-tauri/. Updater-bundle artifacts
          # (.app.tar.gz, .msi.zip, .sig) are intentionally NOT listed —
          # those only get produced when TAURI_SIGNING_PRIVATE_KEY is set,
          # which it isn't yet.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            # Walk the entire bundle/ subtree — DMG lives in dmg/, the
            # updater archive (.app.tar.gz + .sig) lives in macos/.
            bundle_root: "target/aarch64-apple-darwin/release/bundle"
            # Matrix-selected e2e command, invoked from a single non-conditional
            # step below. Keeps the leg's step list clean (one E2E line, not
            # two with conditional skips).
            e2e_cmd: "bash scripts/e2e-mac.sh"
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            # MSI + updater archive (.msi.zip + .sig) all sit in msi/.
            bundle_root: "target/x86_64-pc-windows-msvc/release/bundle"
            # Git Bash on the Windows runner has pwsh on PATH, so calling
            # pwsh from a bash shell works. Keeps the step shell uniform.
            e2e_cmd: "pwsh scripts/e2e-win.ps1 -Target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      # Defender exclusion saves ~25% on Windows wall-clock.
      - name: Disable Defender scan on build dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\node_modules"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            guest-helper
          shared-key: ${{ matrix.platform.name }}

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      # Frontend dist must exist before cargo touches anything that pulls
      # tauri::generate_context!() at compile time.
      - name: Frontend build
        run: pnpm build

      # NB: NO clippy / cargo test here. Those run in the parallel `rust-tests`
      # job. This leg's job is to PRODUCE the bundle as fast as possible.
      # Direct `tauri build` (not tauri-action) so we control the upload step
      # and gate it on e2e green. Signing env vars cause Tauri to emit the
      # updater archive (.app.tar.gz on Mac, .msi.zip on Win) plus a `.sig`
      # next to it; the in-app updater verifies that signature against the
      # public key embedded in tauri.conf.json before installing.
      - name: Tauri build (${{ matrix.platform.name }})
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.platform.args }}

      # Single inline E2E step. The matrix selects the actual command via
      # `e2e_cmd` (bash on Mac, `pwsh` invoked from bash on Windows — Git
      # Bash on the Win runner has pwsh on PATH). No conditional-skip
      # noise in the step list.
      - name: E2E (${{ matrix.platform.name }})
        env:
          TARGET_TRIPLE: ${{ matrix.platform.target }}
          PROMPT_PLAYER_E2E: "1"
        shell: bash
        run: ${{ matrix.platform.e2e_cmd }}

      # Upload only after e2e passes. `--clobber` so re-runs replace the
      # asset. We use `find` (NOT bash globs) because the bundle filenames
      # contain a literal space ("Prompt Player_..."), and unquoted globs
      # word-split on the space. The `while read` loop instead of `mapfile`
      # is for bash 3.2 compatibility — macOS runners ship Apple's bash
      # 3.2 (no GPLv3), and `mapfile` was added in bash 4.
      #
      # We walk the entire bundle/ subtree and match by extension. Wrong-OS
      # patterns (e.g. *.dmg on a Win runner) just match nothing. Updater
      # archives + .sig sidecars are picked up too — they only get produced
      # when TAURI_SIGNING_PRIVATE_KEY is set, but the find call doesn't
      # care if they're missing.
      - name: Upload artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_ROOT: ${{ matrix.platform.bundle_root }}
        shell: bash
        run: |
          if [ ! -d "$BUNDLE_ROOT" ]; then
            echo "::error::bundle root $BUNDLE_ROOT does not exist"
            exit 1
          fi
          found=0
          while IFS= read -r f; do
            found=1
            echo "uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done < <(find "$BUNDLE_ROOT" -type f \( \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.msi.sig" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" \
          \))
          if [ "$found" = "0" ]; then
            echo "::error::no artifacts under $BUNDLE_ROOT"
            find "$BUNDLE_ROOT" -type f | head -50
            exit 1
          fi

  # Compose `latest.json` (the manifest tauri-plugin-updater fetches) once
  # all platform legs have uploaded their signed bundles. Format per
  # https://v2.tauri.app/plugin/updater/#static-json-file:
  #   { version, notes, pub_date, platforms: { <triple>: { signature, url } } }
  # The signature is the raw content of the `.sig` file Tauri emitted next
  # to the updater archive; the URL is the GitHub release-asset download URL.
  # Skipped on platform-leg failure — partial manifests would brick clients.
  compose-updater-manifest:
    name: compose updater latest.json
    needs: release-platform
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compose and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          repo="${{ github.repository }}"
          base="https://github.com/${repo}/releases/download/${tag}"

          mkdir -p sigs
          # IMPORTANT: GitHub replaces the space in "Prompt Player" with a
          # period when assets are uploaded — so the asset names on the
          # release are "Prompt.Player_..." not "Prompt Player_...".
          # (Local file on disk still has the space; the rename happens
          # server-side during gh release upload.)
          #
          # Tauri 2's updater format:
          #   - Mac: .app.tar.gz archive + .app.tar.gz.sig signature
          #   - Win: the .msi itself + .msi.sig signature (NO .msi.zip
          #     wrapper — Tauri 2 dropped that vs v1)
          mac_sig_asset="Prompt.Player.app.tar.gz.sig"
          win_sig_asset="Prompt.Player_${version}_x64_en-US.msi.sig"
          mac_archive="Prompt.Player.app.tar.gz"
          win_archive="Prompt.Player_${version}_x64_en-US.msi"

          # `gh release download` errors if the asset is missing. We do not
          # tolerate missing signatures — better to fail the manifest than
          # ship one that omits a platform silently.
          gh release download "$tag" -R "$repo" -p "$mac_sig_asset" -D sigs --clobber
          gh release download "$tag" -R "$repo" -p "$win_sig_asset" -D sigs --clobber
          mac_sig=$(cat "sigs/${mac_sig_asset}")
          win_sig=$(cat "sigs/${win_sig_asset}")

          notes=$(gh release view "$tag" --json body -q .body)
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # No space-encoding needed — asset names already use periods.
          mac_url="${base}/${mac_archive}"
          win_url="${base}/${win_archive}"

          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg mac_url "$mac_url" \
            --arg win_url "$win_url" \
            --arg mac_sig "$mac_sig" \
            --arg win_sig "$win_sig" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json

          gh release upload "$tag" latest.json --clobber

  # The publish gate. Flips the draft Release to published ONLY if rust-tests
  # AND every build-platform leg succeeded. If either fails, the release
  # stays as a draft with whatever artifacts did land — you can manually
  # inspect, decide whether to publish, or kick a new tag.
  publish-finalize:
    name: publish finalize (draft → published)
    # Also gate on compose-updater-manifest so the release doesn't flip
    # to published BEFORE latest.json is uploaded — otherwise existing
    # installs that auto-check during the gap would see the new version
    # without the manifest and skip the update.
    needs: [rust-tests, release-platform, compose-updater-manifest]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark release as published (if currently draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `-R` so gh doesn't try to run `git remote get-url` — this job
          # has no actions/checkout (doesn't need the source), so there's
          # no git context available.
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          # Pre-releases (rc/alpha/beta) get the prerelease flag set true so
          # the `latest` redirect skips them. Stable releases publish as
          # latest.
          if [[ "$tag" == *-* ]]; then
            echo "tag $tag is a pre-release"
            gh release edit "$tag" --draft=false --prerelease
          else
            echo "tag $tag is a stable release — publishing as latest"
            gh release edit "$tag" --draft=false --latest
          fi

  # Runs once after publish-finalize, regardless of pass/fail. If publish
  # was skipped (rust-tests or a build failed) the release is still draft
  # but we still append auto-changelog so reviewers see what's in it.
  populate-changelog:
    name: populate auto-changelog
    needs: [release-platform, publish-finalize]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate and apply auto-changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "no release at $tag — nothing to populate"
            exit 0
          fi
          notes=$(gh api \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$tag" \
            -q .body)
          existing=$(gh release view "$tag" --json body -q .body)
          combined="${existing}

          ---

          ${notes}"
          gh release edit "$tag" --notes "$combined"
