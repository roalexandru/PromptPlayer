name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands. Keeps PR
# feedback fast and avoids burning a Mac runner on a stale revision.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fail fast if version numbers in package.json, tauri.conf.json, and
  # Cargo.toml have drifted out of sync — these MUST match for the release
  # workflow to publish a coherent artifact set.
  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package.json / tauri.conf.json / Cargo.toml versions match
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' Cargo.toml | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "package.json:     $pkg"
          echo "tauri.conf.json:  $tauri"
          echo "Cargo.toml:       $cargo"
          if [ "$pkg" != "$tauri" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::version mismatch — bump all three to the same value"
            exit 1
          fi

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tell Microsoft Defender to skip Cargo's churn directories on Windows.
      # Saves ~25% on the rust step wall-clock by avoiding per-file scans on
      # the ~100k temporary artifacts cargo writes during a build.
      - name: Disable Defender scan on build dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\node_modules"

      # tauri::generate_context!() (called from app/setup.rs) reads
      # frontendDist at compile time and panics if `dist/` is missing.
      # Build the frontend before running cargo so clippy/check/test see
      # the produced artifacts.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Frontend build (provides ../dist for tauri::generate_context!)
        run: pnpm build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            guest-helper

      - name: Format
        run: cargo fmt --all -- --check

      # Clippy is informational while the cocoa → objc2 migration is in
      # flight: the legacy stack generates ~140 deprecation warnings that
      # would otherwise block every CI run. We deny only correctness lints
      # (real bugs) and let style/deprecation lints through. Tighten back
      # to `-D warnings` once the legacy `cocoa`/`objc` deps are removed.
      - name: Clippy (correctness only)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Bundle ID smoke test (locked at com.roalexandru.promptplayer)
        shell: bash
        run: |
          grep -q '"identifier": "com.roalexandru.promptplayer"' src-tauri/tauri.conf.json
          echo "bundle ID OK"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: IPC lint (no raw invoke() outside `$lib/ipc`)
        shell: bash
        run: bash scripts/lint-ipc.sh
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Production build
        run: pnpm build
